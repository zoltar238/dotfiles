################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=DP-1,2560x1440@165,0x0,1,bitdepth,10
#, bitdepth, 10, cm, hdr, sdrbrightness, 1.15, sdrsaturation, 2.0
monitor=DP-2,1920x1080@240,2560x0,1,bitdepth,10


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty $HOME
$fileManager = nemo
$menu = rofi -show drun
$browser = zen-browser
$spotify = spotify-launcher
$whatsapp = elecwhat
$discord = vesktop
$pycharm = pycharm
$flameshot = flameshot

# Workspace names with zero width for sorting


#################
### AUTOSTART ###
#################


exec-once = [workspace 8 silent; monitor DP-2] $fileManager
exec-once = [workspace 6 silent; monitor DP-1] $pycharm
exec-once = [workspace 6 silent; monitor DP-2] $browser
exec-once = [workspace 10 silent; monitor DP-2] $spotify
exec-once = [workspace 9 silent; monitor DP-2] $whatsapp
exec-once = [workspace 9 silent; monitor DP-2] $flameshot
exec-once = [workspace 9 silent; monitor DP-2] $discord

# exec-once = $terminal
exec-once = mako
exec-once = sudo paccache -rk1
exec-once = hyprctl dispatch focuswindow class:hyprlock
exec-once = hyprlock & hyprpaper & waybar
exec-once = pactl set-default-sink alsa_output.usb-FiiO_DigiHug_USB_Audio-01.analog-stereo # fix for waybar pipeplumber module
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = hypridle
exec-once = openrgb -p murad

